services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: amazonclone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 5}
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    restart: unless-stopped
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: amazonclone
      DB_USER: postgres
      DB_PASSWORD: postgres
      DJANGO_DEBUG: "True"
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [.:/app, media:/app/uploads]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
volumes: {pgdata: {}, media: {}}