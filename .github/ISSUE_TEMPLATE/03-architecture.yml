name: Architecture
description: Propose, analyze, or resolve an architectural decision.
title: "[ARCH] "
labels:
  - type:architecture
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What architectural problem are we solving?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Architecture
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
  - type: textarea
    id: options
    attributes:
      label: Options Considered
      description: Compare realistic alternatives and their trade-offs.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision Required
  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
  - type: textarea
    id: adr
    attributes:
      label: Related ADR
      description: Link an ADR when a decision is accepted.
  - type: textarea
    id: educational-goal
    attributes:
      label: Educational Goal
