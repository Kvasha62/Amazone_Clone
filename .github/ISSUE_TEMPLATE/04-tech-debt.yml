name: Tech Debt
description: Track a deliberate technical debt item and its risk.
title: "[TECH-DEBT] "
labels:
  - type:tech-debt
body:
  - type: textarea
    id: current-problem
    attributes:
      label: Current Problem
    validations:
      required: true
  - type: textarea
    id: why-debt
    attributes:
      label: Why Is This Debt?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
  - type: textarea
    id: affected
    attributes:
      label: Affected Components
  - type: textarea
    id: improvement
    attributes:
      label: Proposed Improvement
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: "- [ ] "
  - type: textarea
    id: tests
    attributes:
      label: Tests
  - type: textarea
    id: educational-goal
    attributes:
      label: Educational Goal
